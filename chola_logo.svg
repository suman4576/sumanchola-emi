<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="murugappaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E"/>
      <stop offset="100%" stop-color="#8B0000"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Murugappa Emblem: Stylized 3-fold layered bow / petals -->
  <g transform="translate(15, 10)">
    <!-- Shield / Crest base -->
    <path d="M 65 15 C 95 15 120 38 120 75 C 120 115 75 138 65 142 C 55 138 10 115 10 75 C 10 38 35 15 65 15 Z" fill="url(#murugappaRed)" opacity="0.95"/>
    
    <!-- Stylized internal golden ribbon / flame -->
    <path d="M 65 30 C 82 30 98 46 98 72 C 98 100 68 120 65 122 C 62 120 32 100 32 72 C 32 46 48 30 65 30 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Central flame / segment -->
    <path d="M 65 42 C 75 42 85 55 85 75 C 85 95 68 108 65 110 C 62 108 45 95 45 75 C 45 55 55 42 65 42 Z" fill="url(#murugappaRed)"/>

    <circle cx="65" cy="74" r="10" fill="url(#goldAccent)"/>
  </g>

  <!-- Brand Typography -->
  <!-- "Chola" Bold Wordmark -->
  <text x="160" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="900" fill="#A6192E" letter-spacing="-1.5">Chola</text>
  
  <!-- "Enter a better life" Tagline -->
  <text x="164" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#1F2937" letter-spacing="2">ENTER A BETTER LIFE</text>

  <!-- Subtitle: Murugappa Group -->
  <text x="165" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#6B7280" letter-spacing="1.2">CHOLAMANDALAM INVESTMENT &amp; FINANCE</text>
</svg>
